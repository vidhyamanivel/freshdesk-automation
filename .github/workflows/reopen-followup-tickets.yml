name: Reopen Freshdesk follow-up tickets

on:
  schedule:
    # 03:45 UTC = 09:15 AM IST, every day (including weekends)
    - cron: "45 3 * * *"
  workflow_dispatch: {}  # lets you click "Run workflow" in the Actions tab to test on demand

jobs:
  reopen-tickets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reopen tickets due today
        env:
          FRESHDESK_API_KEY: ${{ secrets.FRESHDESK_API_KEY }}
          FRESHDESK_DOMAIN: b360.freshdesk.com
        run: python scripts/reopen_followup_tickets.py
